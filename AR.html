<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AR Nova – Universo delle app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@1,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --space:#04060d; --panel:rgba(12,16,28,.82); --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --text:#e8eef8; --muted:#7d889c; --dim:#4d566a;
  --core:#ffb547; --core2:#ff6e4a; --viola:#b084ff; --ghiaccio:#6ee7ff; --ok:#3ddc97;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--space);color:var(--text);font-family:'Sora',system-ui,sans-serif}
#scena{position:fixed;inset:0;display:block;width:100%;height:100%}
#etichette{position:fixed;inset:0;pointer-events:none}
.et{position:absolute;transform:translate(-50%,0);white-space:nowrap;font-size:12px;font-weight:500;letter-spacing:.01em;color:#dfe7f5;
  text-shadow:0 1px 6px #000,0 0 2px #000;padding-top:4px;transition:opacity .2s}
.et small{display:block;text-align:center;font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.et.sel{color:#fff;font-weight:700}
.et.off{opacity:.25}
.et{pointer-events:auto;cursor:pointer}
.et:hover{color:#fff}
.et.coperta{opacity:0;pointer-events:none}

/* intestazione */
.top{position:fixed;left:28px;top:22px;pointer-events:none}
.brand{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.32em;color:var(--muted);text-transform:uppercase}
.titolo{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:4px}
.titolo span{background:linear-gradient(90deg,var(--core),var(--core2));-webkit-background-clip:text;background-clip:text;color:transparent}
.motto{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:21px;color:#f3d9b0;margin-top:2px;opacity:.9}
.orologio{position:fixed;left:28px;bottom:22px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);pointer-events:none}
.orologio b{color:var(--text);font-weight:500;font-size:22px;display:block;letter-spacing:.04em}

/* comandi in basso */
.comandi{position:fixed;left:50%;bottom:22px;transform:translateX(calc(-50% - 190px));display:flex;gap:8px}
.btn{font:inherit;font-size:12.5px;color:var(--text);background:var(--panel);border:1px solid var(--line2);border-radius:999px;padding:9px 16px;cursor:pointer;backdrop-filter:blur(14px);transition:all .15s}
.btn:hover{border-color:rgba(255,255,255,.3);background:rgba(30,38,58,.9)}
.btn.on{border-color:var(--core);color:var(--core)}

/* pannello laterale */
.lato{position:fixed;right:18px;top:18px;bottom:18px;width:380px;background:var(--panel);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(20px);display:flex;flex-direction:column;overflow:hidden}
.cerca{padding:16px 16px 10px}
.cerca input{width:100%;font:inherit;font-size:14px;color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:12px;padding:11px 14px;outline:none}
.cerca input:focus{border-color:var(--viola)}
.cerca .hint{font-size:11px;color:var(--dim);margin-top:7px;font-family:'JetBrains Mono',monospace}
.dettaglio{margin:4px 16px 12px;border:1px solid var(--line2);border-radius:14px;padding:16px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));display:none}
.dettaglio.vis{display:block;animation:su .25s ease-out}
@keyframes su{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.d-testa{display:flex;align-items:center;gap:12px}
.d-ico{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex-shrink:0}
.d-nome{font-size:17px;font-weight:600}
.d-gruppo{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
.d-desc{font-size:13px;line-height:1.55;color:#c3cbda;margin:12px 0 14px}
.d-azioni{display:flex;gap:8px;flex-wrap:wrap}
.apri{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:13.5px;font-weight:600;color:#1a0f00;background:linear-gradient(90deg,var(--core),var(--core2));border-radius:10px;padding:10px 16px}
.apri.no{background:rgba(255,255,255,.06);color:var(--muted);pointer-events:none;font-weight:500}
.mini{font:inherit;font-size:12.5px;color:var(--text);background:transparent;border:1px solid var(--line2);border-radius:10px;padding:9px 12px;cursor:pointer}
.mini:hover{border-color:rgba(255,255,255,.3)}
.lista{flex:1;overflow-y:auto;padding:0 10px 10px}
.lista::-webkit-scrollbar{width:6px}.lista::-webkit-scrollbar-thumb{background:rgba(255,255,255,.08);border-radius:3px}
.gr{font-size:10.5px;font-family:'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:14px 8px 6px;display:flex;align-items:center;gap:8px}
.gr i{width:8px;height:8px;border-radius:50%;display:inline-block}
.voce{display:flex;align-items:center;gap:11px;padding:9px 8px;border-radius:10px;cursor:pointer;transition:background .12s}
.voce:hover{background:rgba(255,255,255,.05)}
.voce.sel{background:rgba(255,181,71,.1)}
.voce .ic{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex-shrink:0}
.voce .n{font-size:13.5px;font-weight:500}
.voce .s{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:250px}
.voce .senza{margin-left:auto;font-size:10px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.piede{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px}
.piede .mini{flex:1}

/* finestra modifica */
.velo{position:fixed;inset:0;background:rgba(2,4,10,.6);backdrop-filter:blur(6px);display:none;place-items:center;z-index:20}
.velo.vis{display:grid}
.modale{width:440px;background:#0e1322;border:1px solid var(--line2);border-radius:18px;padding:22px}
.modale h3{font-size:17px;font-weight:600;margin-bottom:14px}
.campo{margin-bottom:11px}
.campo label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
.campo input,.campo select,.campo textarea{width:100%;font:inherit;font-size:13.5px;color:var(--text);background:rgba(255,255,255,.04);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none}
.campo textarea{resize:vertical;min-height:58px}
.riga{display:flex;gap:10px}.riga .campo{flex:1}
.modale .az{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.modale .az .elimina{margin-right:auto;color:#ff7a8a;border-color:rgba(255,122,138,.3)}
.nota{font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:10px}
.toast{position:fixed;left:50%;top:22px;transform:translateX(calc(-50% - 190px));background:#0e1322;border:1px solid var(--line2);border-radius:999px;padding:9px 18px;font-size:12.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
.toast.vis{opacity:1}
#avvio{position:fixed;inset:0;background:var(--space);display:grid;place-items:center;z-index:40;transition:opacity .8s}
#avvio.via{opacity:0;pointer-events:none}
#avvio div{font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.3em;color:var(--muted)}

/* finestre strette: elenco in basso, universo sopra */
@media (max-width:720px){
  .lato{left:12px;right:12px;top:auto;bottom:12px;width:auto;height:42vh}
  .comandi{bottom:calc(42vh + 24px);transform:translateX(-50%);white-space:nowrap}
  .toast{transform:translateX(-50%)}
  .orologio{left:16px;bottom:calc(42vh + 80px)}
  .top{left:16px}
  .modale{width:calc(100vw - 24px)}
}
</style>
</head>
<body>
<canvas id="scena"></canvas>
<div id="etichette"></div>

<div class="top">
  <div class="brand">AR Digital Marketer · FR Group</div>
  <div class="titolo">AR <span>Nova</span></div>
  <div class="motto">Non mollare, tu ce la farai!</div>
</div>
<div class="orologio"><b id="ora">--:--</b><span id="data"></span></div>

<div class="comandi">
  <button class="btn" id="bVista">⟲ Vista d'insieme</button>
  <button class="btn" id="bOrbite">⏸ Ferma orbite</button>
</div>

<aside class="lato">
  <div class="cerca">
    <input id="cerca" placeholder="Cerca un'app…  (premi /)" autocomplete="off">
    <div class="hint">clic su un pianeta = selezione · doppio clic = apri</div>
  </div>
  <div class="dettaglio" id="dett">
    <div class="d-testa"><div class="d-ico" id="dIco"></div><div><div class="d-nome" id="dNome"></div><div class="d-gruppo" id="dGr"></div></div></div>
    <div class="d-desc" id="dDesc"></div>
    <div class="d-azioni"><a class="apri" id="dApri" target="_blank" rel="noopener">Apri l'app ↗</a><button class="mini" id="dMod">Modifica</button></div>
  </div>
  <div class="lista" id="lista"></div>
  <div class="piede"><button class="mini" id="bNuova">＋ Aggiungi app</button><button class="mini" id="bCopia">Copia elenco</button></div>
</aside>

<div class="velo" id="velo">
  <form class="modale" id="form">
    <h3 id="fTit">Aggiungi app</h3>
    <div class="riga">
      <div class="campo" style="flex:3"><label>Nome</label><input id="fNome" required></div>
      <div class="campo" style="flex:1"><label>Icona</label><input id="fIco" maxlength="4" placeholder="🚀"></div>
    </div>
    <div class="campo"><label>Link (https://…)</label><input id="fUrl" placeholder="https://claude.ai/artifact/…"></div>
    <div class="campo"><label>A cosa serve</label><textarea id="fDesc"></textarea></div>
    <div class="riga">
      <div class="campo"><label>Sistema</label><select id="fGr"></select></div>
      <div class="campo"><label>Aspetto del pianeta</label><select id="fTipo">
        <option value="terra">Terra</option><option value="marte">Rosso</option><option value="gas">Gigante con anelli</option>
        <option value="ghiaccio">Ghiaccio</option><option value="lava">Lava</option><option value="roccia">Roccia</option></select></div>
    </div>
    <div class="az"><button type="button" class="mini elimina" id="fDel">Elimina</button><button type="button" class="mini" id="fAnn">Annulla</button><button type="submit" class="apri" style="border:0;cursor:pointer">Salva</button></div>
    <div class="nota">Le modifiche si salvano in questo browser. Per averle anche su altri dispositivi chiedimi di inserirle nella pagina.</div>
  </form>
</div>
<div class="toast" id="toast"></div>
<div id="avvio"><div>ACCENSIONE UNIVERSO…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const $ = id => document.getElementById(id);

/* ---------- SISTEMI E APP ---------- */
const GRUPPI = {

const BASE = [

  { id:'vendite', nome:'Cruscotto Vendite e Ads', ico:'💶', gr:'ads', tipo:'terra', url:'https://claude.ai/artifact/4F8xFGwvpdobk6XEtG5VkP', desc:'Ordini Shopify e campagne Meta Ads letti dai connettori, con le soglie operative.' },
  { id:'cantieri',nome:'Lavagna Cantieri',    ico:'🛥️', gr:'fr',   tipo:'ghiaccio', url:'https://claude.ai/artifact/MtAVpcMRbuV1GcmD9xC2PZ', desc:'Ore e persone previste nei prossimi 12 mesi per cantiere.' },

  // novità v3
  { id:'argostudio', nome:'ARGO Studio',      ico:'🎬', gr:'mkt',  tipo:'ghiaccio', url:'https://app.ardigitalmarketer.it/argo/', desc:'Lo studio di ARGO sul tuo dominio: video dai prodotti.' },

  { id:'assfr',   nome:'Assistance Report FR', ico:'🛠️', gr:'fr',  tipo:'terra',    url:'https://ardigitalmarketer.app.n8n.cloud/webhook/AssistenzaFR', desc:'Rapporto di assistenza FR Group, compilato tramite n8n.' },
  { id:'n8n',     nome:'n8n',                 ico:'🔗', gr:'strum',tipo:'lava',     url:'https://ardigitalmarketer.app.n8n.cloud', desc:'Gli automatismi e i flussi di lavoro (workflow).' },
  { id:'shopify', nome:'Shopify (Satech e Boreca)', ico:'🛒', gr:'strum', tipo:'terra', url:'https://admin.shopify.com', desc:'Pannello di amministrazione dei negozi Satech e Boreca.' },
  { id:'metaads', nome:'Meta Ads Manager',    ico:'📣', gr:'strum',tipo:'ghiaccio', url:'https://adsmanager.facebook.com', desc:'Gestione delle campagne pubblicitarie su Facebook e Instagram.' },
  { id:'ttads',   nome:'TikTok Ads Manager',  ico:'🎵', gr:'strum',tipo:'marte',    url:'https://ads.tiktok.com', desc:'Gestione delle campagne pubblicitarie su TikTok.' },
  { id:'claudecode', nome:'Claude Code',      ico:'🤖', gr:'strum',tipo:'gas',      url:'https://claude.ai/code', desc:'Le sessioni di programmazione con Claude sui tuoi repository.' },
  { id:'supabase',nome:'Supabase',            ico:'🗄️', gr:'strum',tipo:'roccia',   url:'https://supabase.com/dashboard', desc:'Database e funzioni dietro ARVIS e le altre app.' },
  { id:'github',  nome:'GitHub',              ico:'🐙', gr:'strum',tipo:'ghiaccio', url:'https://github.com/romagnuoloantonio85-cyber', desc:'I tuoi repository, tra cui AR Nova.' },
  { id:'bplan',   nome:'Business plan AR Digital Marketer', ico:'📈', gr:'doc', tipo:'terra', url:'https://claude.ai/artifact/Rcm9TUgFEkrHMYhcp3ADnk', desc:'Il business plan di AR Digital Marketer.' },

];
const CHIAVE = 'arnova-hub-v3', CHIAVE_V1 = 'arnova-hub-v1';
let APPS;
try { APPS = JSON.parse(localStorage.getItem(CHIAVE)) || null; } catch(e) { APPS = null; }
if (!Array.isArray(APPS)) {
  APPS = BASE.map(a => ({...a}));
  // dalla v1: tieni le app aggiunte a mano dal browser
  try { const vecchie = JSON.parse(localStorage.getItem(CHIAVE_V1));
    if (Array.isArray(vecchie)) vecchie.forEach(a => { if (a && a.id && !BASE.some(b => b.id===a.id)) APPS.push(a); });
  } catch(e) {}
}
function salva(){ try { localStorage.setItem(CHIAVE, JSON.stringify(APPS)); } catch(e){} }

/* ---------- TEXTURE PROCEDURALI ---------- */
function rumore(seed){
  const p = new Uint8Array(512); let s = seed*9301+49297;
  const r = () => (s = (s*9301+49297)%233280)/233280;
  const b = [...Array(256).keys()].sort(() => r()-.5); for (let i=0;i<512;i++) p[i]=b[i&255];
  const f = t => t*t*(3-2*t), g = (h,x,y) => ((h&1)?x:-x)+((h&2)?y:-y);
  const n = (x,y) => { const X=Math.floor(x)&255,Y=Math.floor(y)&255; x-=Math.floor(x); y-=Math.floor(y);
    const u=f(x),v=f(y),a=p[X]+Y,c=p[X+1]+Y;
    return (1-v)*((1-u)*g(p[a],x,y)+u*g(p[c],x-1,y)) + v*((1-u)*g(p[a+1],x,y-1)+u*g(p[c+1],x-1,y-1)); };
  return (x,y,o=5) => { let t=0,a=.5,fr=1; for(let i=0;i<o;i++){ t+=a*n(x*fr,y*fr); a*=.5; fr*=2; } return t; };
}
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const PALETTE = {
  terra:   (n,y)=>{ const lat=Math.abs(y-.5)*2; if(lat>.86) return [235,242,250]; return n>.04? mix([70,110,55],[150,130,90],Math.min(1,(n-.04)*4)) : mix([10,40,95],[25,80,150],Math.max(0,n+.4)); },
  marte:   (n)=> mix([110,40,25],[215,110,65],Math.min(1,Math.max(0,n+.5))),
  gas:     (n,y)=>{ const b=Math.sin(y*38+n*5)*.5+.5; return mix([180,140,95],[240,215,170],b); },
  ghiaccio:(n)=> mix([120,170,210],[235,248,255],Math.min(1,Math.max(0,n+.55))),
  lava:    (n)=> n>.12? mix([255,120,30],[255,220,90],Math.min(1,(n-.12)*5)) : mix([25,15,15],[70,35,25],Math.max(0,n+.5)),
  roccia:  (n)=> mix([70,68,72],[170,165,160],Math.min(1,Math.max(0,n+.5)))
};
function texPianeta(tipo, seed){
  const W=512,H=256,c=document.createElement('canvas'); c.width=W; c.height=H;
  const x=c.getContext('2d'), img=x.createImageData(W,H), N=rumore(seed);
  for(let j=0;j<H;j++) for(let i=0;i<W;i++){
    const lo=i/W*Math.PI*2, la=j/H*Math.PI;
    const px=Math.cos(lo)*Math.sin(la)*2.2, py=Math.cos(la)*2.2, pz=Math.sin(lo)*Math.sin(la)*2.2;
    const n=N(px+pz*.7+seed, py+pz*.3, 5);
    let col=PALETTE[tipo](n, j/H);
    if(tipo==='roccia'){ const cr=N(px*4,py*4+pz*2,2); if(cr>.28) col=mix(col,[40,38,40],.6); }
    const k=(j*W+i)*4; img.data[k]=col[0]; img.data[k+1]=col[1]; img.data[k+2]=col[2]; img.data[k+3]=255;
  }
  x.putImageData(img,0,0); const t=new THREE.CanvasTexture(c); t.anisotropy=4; return t;
}

/* ---------- SCENA ---------- */
const canvas=$('scena');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scena=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,1,.1,2000);
scena.add(new THREE.AmbientLight(0x27304a,.9));
const luce=new THREE.PointLight(0xfff1dc,2.1,0,1.2); scena.add(luce);

// stelle
(function(){ const g=new THREE.BufferGeometry(), n=5000, pos=new Float32Array(n*3), col=new Float32Array(n*3);
  for(let i=0;i<n;i++){ const r=500+Math.random()*700, t=Math.random()*Math.PI*2, f=Math.acos(2*Math.random()-1);
    pos.set([r*Math.sin(f)*Math.cos(t), r*Math.cos(f), r*Math.sin(f)*Math.sin(t)], i*3);
    const w=.6+Math.random()*.4, tint=Math.random(); col.set(tint<.15?[w,w*.85,w*.7]:tint<.3?[w*.8,w*.9,w]:[w,w,w], i*3); }
  g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('color',new THREE.BufferAttribute(col,3));
  scena.add(new THREE.Points(g,new THREE.PointsMaterial({size:1.6,vertexColors:true,sizeAttenuation:false,transparent:true,opacity:.85})));
})();
// nebulosa di sfondo
(function(){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  const gr=x.createRadialGradient(128,128,0,128,128,128); gr.addColorStop(0,'rgba(176,132,255,.22)'); gr.addColorStop(.5,'rgba(80,60,160,.07)'); gr.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=gr; x.fillRect(0,0,256,256); const t=new THREE.CanvasTexture(c);
  [[-300,80,-500,700],[400,-120,-600,600]].forEach(([a,b,cc,s])=>{ const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthWrite:false,blending:THREE.AdditiveBlending})); sp.position.set(a,b,cc); sp.scale.set(s,s,1); scena.add(sp); });
})();

// sole
function alone(col,size,op){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  const g=x.createRadialGradient(128,128,0,128,128,128); g.addColorStop(0,col); g.addColorStop(.25,col.replace(/[\d.]+\)$/,(op*.5)+')')); g.addColorStop(1,'rgba(0,0,0,0)');
  x.fillStyle=g; x.fillRect(0,0,256,256);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthWrite:false,blending:THREE.AdditiveBlending,transparent:true})); s.scale.set(size,size,1); return s; }
const sole=new THREE.Mesh(new THREE.SphereGeometry(4.2,64,48), new THREE.MeshBasicMaterial({map:(()=>{ const c=document.createElement('canvas'); c.width=512;c.height=256; const x=c.getContext('2d'),im=x.createImageData(512,256),N=rumore(7);
  for(let j=0;j<256;j++)for(let i=0;i<512;i++){ const n=N(i/40,j/40,5); const col=mix([255,120,40],[255,225,140],Math.min(1,Math.max(0,n+.55))); const k=(j*512+i)*4; im.data.set([col[0],col[1],col[2],255],k);} x.putImageData(im,0,0); return new THREE.CanvasTexture(c); })()}));
sole.userData={tipo:'sole'}; scena.add(sole);
const alone1=alone('rgba(255,170,70,0.9)',30,.9), alone2=alone('rgba(255,110,74,0.5)',60,.5); scena.add(alone1); scena.add(alone2);
// "AR" sul sole come sprite
(function(){ const c=document.createElement('canvas'); c.width=256;c.height=128; const x=c.getContext('2d'); x.font='700 76px Sora, sans-serif'; x.textAlign='center'; x.textBaseline='middle';
  x.shadowColor='rgba(120,30,0,.8)'; x.shadowBlur=14; x.fillStyle='#fff6e6'; x.fillText('AR',128,66);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false,transparent:true})); s.scale.set(6.4,3.2,1); s.renderOrder=5; scena.add(s); })();

/* ---------- PIANETI ---------- */
let pianeti=[], cliccabili=[sole];
const etDiv=$('etichette');
function costruisci(){
  pianeti.forEach(p=>{ scena.remove(p.perno); scena.remove(p.orbitaLinea); p.et.remove(); });
  pianeti=[]; cliccabili=[sole];
  APPS.forEach((a,i)=>{
    const r=1.1+((i*37)%5)*.22+(a.tipo==='gas'?.5:0);
    const orbita=11+i*3.6;
    const mat=new THREE.MeshStandardMaterial({map:texPianeta(a.tipo,i*13+3),roughness:a.tipo==='ghiaccio'?.55:.92,metalness:0,
      emissive:a.tipo==='lava'?new THREE.Color(0xff5a1a):new THREE.Color(0), emissiveIntensity:a.tipo==='lava'?.35:0});
    const perno=new THREE.Group();
    const corpo=new THREE.Mesh(new THREE.SphereGeometry(r,64,48),mat);
    corpo.rotation.z=.25+i*.05; corpo.userData={tipo:'pianeta',id:a.id}; perno.add(corpo); cliccabili.push(corpo);
    // atmosfera colorata per sistema
    const atm=alone(hexA(GRUPPI[a.gr]?.col||'#ffffff',.55), r*4.2,.55); perno.add(atm);
    if(a.tipo==='gas'){ const ag=new THREE.RingGeometry(r*1.4,r*2.25,96); const pos=ag.attributes.position, uv=ag.attributes.uv;
      for(let k=0;k<pos.count;k++){ const v=new THREE.Vector3().fromBufferAttribute(pos,k); uv.setXY(k,(v.length()-r*1.4)/(r*.85),.5); }
      const c=document.createElement('canvas'); c.width=256;c.height=4; const x=c.getContext('2d');
      for(let k=0;k<256;k++){ const o=.25+.5*Math.abs(Math.sin(k*.21))*(k%17<3?.2:1); x.fillStyle=`rgba(225,205,165,${o})`; x.fillRect(k,0,1,4); }
      const anello=new THREE.Mesh(ag,new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(c),side:THREE.DoubleSide,transparent:true,depthWrite:false}));
      anello.rotation.x=Math.PI/2.3; perno.add(anello); }
    // selezione: anello luminoso
    const sel=new THREE.Mesh(new THREE.RingGeometry(r*1.55,r*1.65,96),new THREE.MeshBasicMaterial({color:0xffb547,side:THREE.DoubleSide,transparent:true,opacity:0,depthWrite:false}));
    sel.userData.anelloSel=true; perno.add(sel);
    scena.add(perno);
    // orbita
    const pts=[]; for(let k=0;k<=256;k++){ const t=k/256*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(t)*orbita,0,Math.sin(t)*orbita)); }
    const orbitaLinea=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:new THREE.Color(GRUPPI[a.gr]?.col||'#8fa3c8'),transparent:true,opacity:.13}));
    scena.add(orbitaLinea);
    const et=document.createElement('div'); et.className='et'; et.innerHTML=`${a.ico||''} ${esc(a.nome)}<small>${esc(GRUPPI[a.gr]?.nome||'')}</small>`; etDiv.appendChild(et);
    // clic sul nome: apre subito lo strumento; senza link apre il pannello
    et.title=a.url?"Apri l'app":'Link da aggiungere';
    et.addEventListener('click',()=>{ if(a.url) apriLink(a.url); else seleziona(a.id); });
    pianeti.push({app:a,r,orbita,angolo:i*2.399+.3,vel:.05/Math.sqrt(i+2),perno,corpo,sel,orbitaLinea,et});
  });
  disegnaLista();
}
function hexA(h,a){ const [r,g,b]=hex(h); return `rgba(${r},${g},${b},${a})`; }
function esc(s){ return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- CAMERA E CONTROLLI ---------- */
const vista={teta:.6,fi:1.08,dist:115,bersaglio:new THREE.Vector3(),seguito:null};
const obiettivo={teta:.6,fi:1.08,dist:115};
let trascina=null, mosso=false, orbiteFerme=false, selezionata=null, cerca='';
canvas.addEventListener('pointerdown',e=>{ trascina={x:e.clientX,y:e.clientY}; mosso=false; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove',e=>{
  if(trascina){ const dx=e.clientX-trascina.x, dy=e.clientY-trascina.y; if(Math.abs(dx)+Math.abs(dy)>3) mosso=true;
    obiettivo.teta-=dx*.005; obiettivo.fi=Math.min(1.5,Math.max(.15,obiettivo.fi-dy*.004)); trascina={x:e.clientX,y:e.clientY}; }
  else { const h=colpito(e); canvas.style.cursor=h?'pointer':'grab'; }
});
canvas.addEventListener('pointerup',e=>{ trascina=null; if(!mosso){ const h=colpito(e); if(h) seleziona(h); } });
canvas.addEventListener('dblclick',e=>{ const h=colpito(e); if(h&&h!=='sole'){ const a=APPS.find(x=>x.id===h); if(a&&a.url) apriLink(a.url); } });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); obiettivo.dist=Math.min(260,Math.max(8,obiettivo.dist*(1+e.deltaY*.001))); },{passive:false});
const ray=new THREE.Raycaster(), mv=new THREE.Vector2();
function colpito(e){ const b=canvas.getBoundingClientRect(); mv.set((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1);
  ray.setFromCamera(mv,camera); const h=ray.intersectObjects(cliccabili,false)[0]; if(!h) return null; return h.object.userData.tipo==='sole'?'sole':h.object.userData.id; }
function apriLink(u){ const a=document.createElement('a'); a.href=u; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); }

function seleziona(id){
  if(id==='sole'){ vistaInsieme(); return; }
  selezionata=id; const p=pianeti.find(p=>p.app.id===id); if(!p) return;
  vista.seguito=p; obiettivo.dist=Math.max(14,p.r*9); obiettivo.fi=1.05;
  mostraDettaglio(p.app); disegnaLista();
}
function vistaInsieme(){ selezionata=null; vista.seguito=null; obiettivo.dist=distInsieme(); obiettivo.fi=1.08; $('dett').classList.remove('vis'); disegnaLista(); }
$('bVista').onclick=vistaInsieme;
$('bOrbite').onclick=()=>{ orbiteFerme=!orbiteFerme; $('bOrbite').classList.toggle('on',orbiteFerme); $('bOrbite').textContent=orbiteFerme?'▶ Riprendi orbite':'⏸ Ferma orbite'; };

/* ---------- PANNELLO ---------- */
function mostraDettaglio(a){
  const g=GRUPPI[a.gr]||{nome:'',col:'#888'};
  $('dIco').textContent=a.ico||'•'; $('dIco').style.background=hexA(g.col,.18); $('dIco').style.boxShadow=`0 0 0 1px ${hexA(g.col,.45)}`;
  $('dNome').textContent=a.nome; $('dGr').textContent=g.nome; $('dGr').style.color=g.col; $('dDesc').textContent=a.desc||'';
  const ap=$('dApri'); if(a.url){ ap.href=a.url; ap.classList.remove('no'); ap.textContent="Apri l'app ↗"; } else { ap.removeAttribute('href'); ap.classList.add('no'); ap.textContent='Link da aggiungere'; }
  $('dett').classList.add('vis');
}
function disegnaLista(){
  const q=cerca.trim().toLowerCase(); let h='';
  Object.entries(GRUPPI).forEach(([k,g])=>{
    const voci=APPS.filter(a=>a.gr===k && (!q || (a.nome+' '+a.desc).toLowerCase().includes(q)));
    if(!voci.length) return;
    h+=`<div class="gr"><i style="background:${g.col}"></i>${g.nome}</div>`;
    voci.forEach(a=>{ h+=`<div class="voce${a.id===selezionata?' sel':''}" data-id="${a.id}"><div class="ic" style="background:${hexA(g.col,.15)}">${a.ico||'•'}</div><div style="min-width:0"><div class="n">${esc(a.nome)}</div><div class="s">${esc(a.desc)}</div></div>${a.url?'':'<span class="senza">senza link</span>'}</div>`; });
  });
  $('lista').innerHTML=h||'<div class="gr">Nessuna app trovata</div>';
  $('lista').querySelectorAll('.voce').forEach(v=>{ v.onclick=()=>seleziona(v.dataset.id); v.ondblclick=()=>{ const a=APPS.find(x=>x.id===v.dataset.id); if(a&&a.url) apriLink(a.url); }; });
}
$('cerca').addEventListener('input',e=>{ cerca=e.target.value; disegnaLista(); });
$('cerca').addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=$('lista').querySelector('.voce'); if(v) seleziona(v.dataset.id); } if(e.key==='Escape'){ e.target.value=''; cerca=''; disegnaLista(); e.target.blur(); } });
addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if(e.key==='/'){ e.preventDefault(); $('cerca').focus(); } if(e.key==='Escape'){ if($('velo').classList.contains('vis')) chiudi(); else vistaInsieme(); }
  if(e.key==='Enter'&&selezionata){ const a=APPS.find(x=>x.id===selezionata); if(a&&a.url) apriLink(a.url); } });

/* ---------- AGGIUNGI / MODIFICA ---------- */
let inModifica=null;
$('fGr').innerHTML=Object.entries(GRUPPI).map(([k,g])=>`<option value="${k}">${g.nome}</option>`).join('');
function apriForm(a){
  inModifica=a||null; $('fTit').textContent=a?'Modifica app':'Aggiungi app';
  $('fNome').value=a?a.nome:''; $('fIco').value=a?a.ico:''; $('fUrl').value=a?a.url:''; $('fDesc').value=a?a.desc:'';
  $('fGr').value=a?a.gr:'mkt'; $('fTipo').value=a?a.tipo:'terra'; $('fDel').style.display=a?'':'none';
  $('velo').classList.add('vis'); setTimeout(()=>$('fNome').focus(),50);
}
function chiudi(){ $('velo').classList.remove('vis'); }
$('bNuova').onclick=()=>apriForm(null);
$('dMod').onclick=()=>{ const a=APPS.find(x=>x.id===selezionata); if(a) apriForm(a); };
$('fAnn').onclick=chiudi; $('velo').onclick=e=>{ if(e.target.id==='velo') chiudi(); };
let conferma=false;
$('fDel').onclick=()=>{ if(!inModifica) return; if(!conferma){ conferma=true; $('fDel').textContent='Sicuro? Clicca di nuovo'; setTimeout(()=>{conferma=false;$('fDel').textContent='Elimina';},3000); return; }
  APPS=APPS.filter(x=>x!==inModifica); salva(); chiudi(); vistaInsieme(); costruisci(); avviso('App eliminata'); conferma=false; $('fDel').textContent='Elimina'; };
$('form').onsubmit=e=>{ e.preventDefault();
  let url=$('fUrl').value.trim(); if(url && !/^https?:\/\//i.test(url)) url='https://'+url;
  const dati={nome:$('fNome').value.trim(),ico:$('fIco').value.trim()||'🪐',url,desc:$('fDesc').value.trim(),gr:$('fGr').value,tipo:$('fTipo').value};
  if(!dati.nome) return;
  let id;
  if(inModifica){ Object.assign(inModifica,dati); id=inModifica.id; } else { id='app'+Date.now(); APPS.push({id,...dati}); }
  salva(); chiudi(); costruisci(); seleziona(id); avviso(inModifica?'Modifiche salvate':'App messa in orbita');
};
$('bCopia').onclick=async()=>{ const t=APPS.map(a=>`${a.ico} ${a.nome} [${GRUPPI[a.gr]?.nome}] — ${a.url||'senza link'}`).join('\n');
  try{ await navigator.clipboard.writeText(t); avviso('Elenco copiato: incollalo in chat per salvarlo nella pagina'); }catch(e){ avviso('Copia non consentita da questo browser'); } };
let tt; function avviso(m){ $('toast').textContent=m; $('toast').classList.add('vis'); clearTimeout(tt); tt=setTimeout(()=>$('toast').classList.remove('vis'),2600); }

/* ---------- OROLOGIO ---------- */
function orologio(){ const d=new Date(); $('ora').textContent=d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
  $('data').textContent=d.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}); }
orologio(); setInterval(orologio,15000);

/* ---------- ANIMAZIONE ---------- */
// zona libera (non coperta dall'elenco) e distanza per vedere tutto il sistema
let zona={x:0,y:0,w:1,h:1}, altPiena=1;
function calcolaZona(){ const w=innerWidth,h=innerHeight, b=document.querySelector('.lato').getBoundingClientRect();
  if(b.top>h*.3) zona={x:0,y:0,w:w,h:Math.max(1,b.top)};        // elenco in basso
  else zona={x:0,y:0,w:Math.max(1,b.left),h:h};                 // elenco a destra
}
function distInsieme(){ const raggio=(11+Math.max(0,APPS.length-1)*3.6)*1.1;
  return Math.max(115, raggio*altPiena/(zona.w*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)))); }
function ridimensiona(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h); calcolaZona();
  // centra il sole nella zona libera: sposta il centro della proiezione
  const dx=w/2-(zona.x+zona.w/2), dy=h/2-(zona.y+zona.h/2);
  const fw=w+2*Math.abs(dx), fh=h+2*Math.abs(dy); altPiena=fh;
  camera.aspect=fw/fh; camera.setViewOffset(fw,fh,dx>0?2*dx:0,dy>0?2*dy:0,w,h); camera.updateProjectionMatrix();
  if(!vista.seguito) obiettivo.dist=distInsieme(); }
ridimensiona(); vista.dist=obiettivo.dist; addEventListener('resize',ridimensiona);
const tmp=new THREE.Vector3(); let ultimo=performance.now();
function anima(t){
  const dt=Math.min(.05,(t-ultimo)/1000); ultimo=t;
  if(!orbiteFerme) pianeti.forEach(p=>{ p.angolo+=p.vel*dt; });
  pianeti.forEach((p,i)=>{
    p.perno.position.set(Math.cos(p.angolo)*p.orbita,Math.sin(p.angolo*1.3+i)*.6,Math.sin(p.angolo)*p.orbita);
    p.corpo.rotation.y+=dt*.12;
    const on=p.app.id===selezionata; p.sel.material.opacity+=((on?.85:0)-p.sel.material.opacity)*.12; p.sel.lookAt(camera.position);
  });
  sole.rotation.y+=dt*.03; const pulsa=1+Math.sin(t*.0012)*.04; alone1.scale.set(30*pulsa,30*pulsa,1);
  // camera
  vista.teta+=(obiettivo.teta-vista.teta)*.08; vista.fi+=(obiettivo.fi-vista.fi)*.08; vista.dist+=(obiettivo.dist-vista.dist)*.06;
  if(!trascina && !vista.seguito) obiettivo.teta+=dt*.012;
  const dest=vista.seguito? vista.seguito.perno.position : new THREE.Vector3();
  vista.bersaglio.lerp(dest,vista.seguito?.15:.08);
  camera.position.set(vista.bersaglio.x+vista.dist*Math.sin(vista.fi)*Math.cos(vista.teta), vista.bersaglio.y+vista.dist*Math.cos(vista.fi), vista.bersaglio.z+vista.dist*Math.sin(vista.fi)*Math.sin(vista.teta));
  camera.lookAt(vista.bersaglio);
  renderer.render(scena,camera);
  // etichette
  const w=innerWidth,h=innerHeight, q=cerca.trim().toLowerCase(), visibili=[];
  pianeti.forEach(p=>{
    tmp.copy(p.perno.position); tmp.y-=p.r*1.15; tmp.project(camera);
    const dietro=tmp.z>1; const x=(tmp.x*.5+.5)*w, y=(-tmp.y*.5+.5)*h;
    const fuori=x<zona.x||x>zona.x+zona.w||y>zona.y+zona.h;
    p.et.style.display=dietro||fuori?'none':''; p.et.style.left=x+'px'; p.et.style.top=y+'px';
    p.et.classList.toggle('sel',p.app.id===selezionata);
    const off=!!q && !(p.app.nome+' '+p.app.desc).toLowerCase().includes(q);
    p.et.classList.toggle('off',off);
    if(!dietro&&!fuori) visibili.push({p,x,y,z:tmp.z,pri:p.app.id===selezionata?0:off?2:1});
  });
  // nomi leggibili: se due si sovrappongono resta quello selezionato, poi il più vicino
  visibili.sort((a,b)=>a.pri-b.pri||a.z-b.z);
  const posati=[];
  visibili.forEach(v=>{ const e=v.p.et;
    if(!v.p.lw){ v.p.lw=e.offsetWidth; v.p.lh=e.offsetHeight; }
    const r={l:v.x-v.p.lw/2-3,t:v.y,r:v.x+v.p.lw/2+3,b:v.y+v.p.lh};
    const urta=posati.some(o=>r.l<o.r&&r.r>o.l&&r.t<o.b&&r.b>o.t);
    e.classList.toggle('coperta',urta); if(!urta) posati.push(r);
  });
  requestAnimationFrame(anima);
}
costruisci();
if(document.fonts) document.fonts.ready.then(()=>pianeti.forEach(p=>p.lw=0));
requestAnimationFrame(t=>{ ultimo=t; anima(t); setTimeout(()=>$('avvio').classList.add('via'),300); });
})();
</script>
</body>
